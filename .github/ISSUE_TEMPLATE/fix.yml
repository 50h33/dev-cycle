name: Fix
description: 잘못된 동작이나 오류를 수정합니다.
labels: ["fix"]
body:
  - type: input
    id: problem
    attributes:
      label: 무엇을 수정하나요?
      placeholder: "예: 설정 파일이 없을 때 종료 코드가 잘못 반환됨"
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: 현재 동작과 재현 방법
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
